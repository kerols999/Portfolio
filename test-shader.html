
<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<pre id="log"></pre>
<script>
  const gl = document.getElementById('c').getContext('webgl');
  const vsSource = `
    attribute vec2 a_pos;
    varying vec2 v_uv;
    void main() {
      v_uv = (a_pos + 1.0) * 0.5;
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  const fsSource = `
    precision highp float;
    varying vec2 v_uv;
    uniform vec2 u_resolution;
    uniform vec2 u_mouse;
    uniform vec2 u_mouse_vel;
    uniform float u_time;
    uniform vec4 u_splats[12];

    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

    float snoise(vec2 v) {
      const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
      vec2 i  = floor(v + dot(v, C.yy));
      vec2 x0 = v -   i + dot(i, C.xx);
      vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
      vec4 x12 = x0.xyxy + C.xxzz;
      x12.xy -= i1;
      i = mod289(i);
      vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
      vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
      m = m*m; m = m*m;
      vec3 x = 2.0 * fract(p * C.www) - 1.0;
      vec3 h = abs(x) - 0.5;
      vec3 ox = floor(x + 0.5);
      vec3 a0 = x - ox;
      m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
      vec3 g;
      g.x  = a0.x  * x0.x  + h.x  * x0.y;
      g.yz = a0.yz * x12.xz + h.yz * x12.yw;
      return 130.0 * dot(m, g);
    }

    vec2 curlNoise(vec2 p) {
      const float e = 0.015;
      float n1 = snoise(p + vec2(0.0, e));
      float n2 = snoise(p - vec2(0.0, e));
      float n3 = snoise(p + vec2(e, 0.0));
      float n4 = snoise(p - vec2(e, 0.0));
      return vec2((n1 - n2) / (2.0 * e), -(n3 - n4) / (2.0 * e));
    }

    void main() {
      vec2 uv = v_uv;
      float aspect = u_resolution.x / u_resolution.y;
      vec2 p = uv;
      p.x *= aspect;

      vec2 flow1 = curlNoise(p * 1.35 + vec2(u_time * 0.035, -u_time * 0.025));
      vec2 flow2 = curlNoise(p * 2.8 - flow1 * 0.4 + vec2(-u_time * 0.02, u_time * 0.03));
      vec2 warpedP = p + (flow1 * 0.22 + flow2 * 0.12);

      vec2 mouseP = vec2(u_mouse.x * aspect, u_mouse.y);
      vec2 toCursor = warpedP - mouseP;
      float cursorDist = length(toCursor);

      vec2 velWake = u_mouse_vel * smoothstep(0.42, 0.0, cursorDist);
      warpedP += velWake * 0.4;

      float smoke = 0.0;
      float glow = 0.0;

      for (int i = 0; i < 12; i++) {
        vec4 splat = u_splats[i];
        if (splat.w > 0.01) {
          vec2 splatP = vec2(splat.x * aspect, splat.y);
          vec2 offset = (warpedP - splatP) - flow1 * (splat.z * 0.25);
          float d = length(offset);
          float radius = 0.06 + splat.z * 0.28;
          float life = (1.0 - splat.z) * splat.w;
          float puff = smoothstep(radius, 0.0, d) * life;
          float detail = snoise(offset * 7.5 + vec2(u_time * 0.12, 0.0)) * 0.5 + 0.5;
          smoke += puff * (0.65 + 0.35 * detail);
          glow += smoothstep(radius * 2.2, 0.0, d) * life * 0.45;
        }
      }

      gl_FragColor = vec4(vec3(smoke), 1.0);
    }
  `;

  function check(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    const ok = gl.getShaderParameter(s, gl.COMPILE_STATUS);
    const log = gl.getShaderInfoLog(s);
    return { ok, log };
  }

  const vRes = check(gl.VERTEX_SHADER, vsSource);
  const fRes = check(gl.FRAGMENT_SHADER, fsSource);
  console.log('VERTEX:', vRes);
  console.log('FRAGMENT:', fRes);
  document.getElementById('log').textContent = JSON.stringify({ vRes, fRes }, null, 2);
</script>
</body>
</html>
